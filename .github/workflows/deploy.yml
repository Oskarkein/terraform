name: Deploy Backend

on:
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Bajar imagen desde el registry
        run: docker pull 10.124.0.2:5000/springboot-app

      - name: Detener servicios anteriores
        run: docker compose down || true

      - name: Levantar backend, postgres y adminer
        run: docker compose up -d

      - name: Ver contenedores activos
        run: docker ps