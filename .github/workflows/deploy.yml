name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Cargar variables
        run: cat /opt/app/.env >> $GITHUB_ENV

      - name: Detener servicios anteriores
        run: docker compose down || true

      - name: Levantar backend, postgres y adminer
        run: docker compose --env-file /opt/app/.env up -d --pull always

      - name: Ver contenedores activos
        run: docker ps